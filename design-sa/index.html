<style>

img{display:block;max-width:100%;height:auto}

:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.wrap{padding-left:clamp(16px,4vw,64px);padding-right:clamp(16px,4vw,64px)}
.sec{padding-top:clamp(64px,9vw,140px)}

/* ---------- landing ---------- */
.land{min-height:100svh;background:#0f1f19;color:#ece6dc;padding:clamp(28px,5vw,72px)}
.land .lg img{width:min(320px,70vw)}
.land h1{font-weight:300;font-size:clamp(30px,4.4vw,60px);line-height:1.2;margin:34px 0 12px;letter-spacing:-.01em}
.land .sub{max-width:720px;opacity:.75}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin-top:44px}
.card{background:#f4f0e9;color:#1f2420;display:flex;flex-direction:column;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.card .ph{aspect-ratio:4/3;overflow:hidden;position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph b{position:absolute;left:14px;top:12px;font-size:13px;font-weight:600;background:#fff;padding:7px 11px;letter-spacing:.1em}
.card .tx{padding:20px 22px 24px}
.card h2{font-size:22px;font-weight:600;line-height:1.3}
.card h2 small{display:block;font-size:12px;letter-spacing:.2em;font-weight:500;opacity:.55;margin-bottom:6px}
.card p{font-size:14px;opacity:.75;margin-top:8px}
.card .go{margin-top:16px;font-size:13px;letter-spacing:.1em;font-weight:600}
.howto{margin-top:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px 28px;font-size:14px;opacity:.8}
.howto div{border-top:1px solid rgba(236,230,220,.25);padding-top:12px}
.land .lfoot{margin-top:56px;font-size:12px;opacity:.5}

/* ---------- shared bits ---------- */
.lt{position:relative;overflow:hidden;touch-action:pan-y;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;background:#222}
.lt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.lt .on-img{opacity:0;transition:opacity .9s ease}
.lt.on .on-img,.lt.pin .on-img{opacity:1}
.bulb{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:rgba(20,18,16,.55);color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px);transition:background .4s,color .4s;z-index:2}
.bulb svg{width:20px;height:20px}
.lt.pin .bulb{background:#f6e7bf;color:#2a2318}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.tile{position:relative;display:block;aspect-ratio:1/1;overflow:hidden;background:#d8d2ca}
.tile>img{width:100%;height:100%;object-fit:cover;transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
.tile:hover>img,.tile:focus-visible>img{transform:scale(1.05)}
.ov{position:absolute;inset:0;background:rgba(15,31,25,.55);opacity:0;transition:opacity .8s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:20px}
.ov>*{transform:translateY(10px);opacity:0;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .9s ease}
.ov .lg img{width:120px}
.ov .nm{font-family:'Noto Serif KR',serif;font-size:clamp(17px,1.5vw,22px);font-weight:400}
.ov .py{font-size:12px;letter-spacing:.22em}
.ov .lg{transition-delay:.05s}.ov .nm{transition-delay:.15s}.ov .py{transition-delay:.3s}
.ov .ln{width:0;height:1px;background:#fff;transform:none;opacity:1;transition:width .9s ease .25s}
.tile:hover .ov,.tile:focus-visible .ov{opacity:1}
.tile:hover .ov>*,.tile:focus-visible .ov>*{transform:none;opacity:1}
.tile:hover .ov .ln,.tile:focus-visible .ov .ln{width:120px}
@media(hover:none){.ov{opacity:1;background:linear-gradient(transparent 55%,rgba(15,31,25,.7));justify-content:flex-end;align-items:flex-start;text-align:left;gap:4px}.ov>*{opacity:1;transform:none}.ov .lg,.ov .ln{display:none}}
.pop{position:fixed;inset:0;z-index:95;background:rgba(10,14,12,.9);display:none;align-items:center;justify-content:center;padding:clamp(12px,4vw,48px)}
.pop.open{display:flex}
.pop .in{max-width:min(1400px,100%);width:100%;display:flex;flex-direction:column;gap:14px;color:#fff}
.pop .im{max-height:76vh;width:100%;object-fit:contain}
.pop .row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.pop .row b{font-family:'Noto Serif KR',serif;font-weight:400;font-size:20px}
.pop .row small{display:block;opacity:.7;font-size:13px}
.pop .gol{border:1px solid rgba(255,255,255,.6);padding:12px 20px;font-size:13px;letter-spacing:.1em}
.pop .x{position:absolute;right:14px;top:10px;width:48px;height:48px;font-size:30px;color:#fff}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;padding-bottom:10px}
.strip>*{flex:0 0 auto;scroll-snap-align:start;height:clamp(220px,30vw,420px)}
.strip img{height:100%;width:auto;object-fit:cover}
.strip-hint{font-size:12px;letter-spacing:.12em;opacity:.55;margin:0 0 12px}
.steps{display:grid;grid-template-columns:repeat(4,1fr)}
.steps div{border-top:1px solid rgba(128,128,128,.35);padding:22px 22px 0 0}
.steps b{display:block;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:34px;line-height:1;opacity:.5}
.steps h3{font-weight:600;font-size:17px;margin:14px 0 6px}
.steps p{font-size:14px;opacity:.72}
@media(max-width:800px){.steps{grid-template-columns:repeat(2,1fr);gap:20px 0}}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;max-width:880px}
.cform label{display:flex;flex-direction:column;gap:6px;font-size:13px}
.cform .full{grid-column:1/-1}
.cform input,.cform select,.cform textarea{font:inherit;font-size:16px;padding:12px 14px;border:1px solid rgba(128,128,128,.45);background:transparent;color:inherit;border-radius:0;min-height:46px}
.cform textarea{min-height:120px;resize:vertical}
.cform .agree{flex-direction:row;align-items:center;gap:10px}
.cform .agree input{min-height:auto;width:20px;height:20px}
.cform button{grid-column:1/-1;justify-self:start}
@media(max-width:600px){.cform{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid currentColor;padding:13px 22px;font-size:14px;letter-spacing:.06em;min-height:46px}
.msg{max-width:420px;margin-top:36px;display:none}
.msg.show{display:block}
.msg .t{font-size:12px;opacity:.65;margin-bottom:10px}
.msg .phone{background:#e9edf0;border-radius:18px;padding:18px;color:#1c2229}
.msg .who{display:flex;gap:10px;align-items:center;font-size:13px;margin-bottom:10px}
.msg .who i{width:34px;height:34px;border-radius:10px;background:#0f1f19;display:grid;place-items:center;font-style:normal;color:#ece6dc;font-family:'Cormorant Garamond',serif;font-size:17px}
.msg .bub{background:#fff;border-radius:4px 14px 14px 14px;padding:14px 16px;font-size:14px;line-height:1.65;white-space:pre-line}
.explain{max-width:880px;font-size:13px;opacity:.7;margin-top:22px;line-height:1.8}
.foot{padding-top:70px;padding-bottom:100px;font-size:13px;line-height:1.9}
.foot .flogo{width:170px;margin-bottom:18px}
.foot .biz span{display:inline-block;margin-right:16px}
.foot .ext a{margin-right:16px;text-decoration:underline;text-underline-offset:3px}
.gal{display:flex;flex-wrap:wrap;gap:10px}
.gal:after{content:'';flex-grow:999999}
.gal img{flex:var(--r) 1 calc(var(--r) * clamp(200px,24vw,440px));width:0;height:auto;aspect-ratio:var(--ar);object-fit:cover}
.pager{display:flex;justify-content:space-between;gap:20px;padding:56px 0;border-top:1px solid rgba(128,128,128,.25);margin-top:80px;font-size:15px}
.pager a{display:flex;flex-direction:column}
.pager small{opacity:.55;font-size:11px;letter-spacing:.18em}
.pager a:last-child{text-align:right}

/* =================== A : Signature =================== */
.va{background:#f7f5f1;color:#1d1f1c}
.a-hero{position:relative;height:100svh;min-height:560px;overflow:hidden;background:#1e1c1a;color:#fff}

.a-bar .rt{display:flex;align-items:center;gap:14px;font-size:13px}

.a-dots{position:absolute;z-index:3;right:clamp(16px,4vw,64px);bottom:96px;display:flex;gap:8px}

@media(max-width:760px){.a-bar nav,.a-top nav .opt{display:none}.a-top nav{gap:14px;font-size:13px}.a-word{width:84vw}}
.va h2.t{font-family:'Noto Serif KR',serif;font-weight:400;font-size:clamp(24px,2.8vw,40px);line-height:1.35;margin:10px 0 30px}
.a-intro{text-align:center}
.a-intro q{display:block;font-family:'Noto Serif KR',serif;font-weight:300;font-size:clamp(24px,3.2vw,46px);line-height:1.45;quotes:none}
.a-intro p{max-width:760px;margin:22px auto 0;opacity:.7}
.a-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.a-head .more{font-size:13px;letter-spacing:.16em;border-bottom:1px solid;padding-bottom:3px}
.lights{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lights .lt{aspect-ratio:3/2}
@media(max-width:900px){.lights{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(0,0,0,.18)}
.facts div{padding:22px 16px 0 0}
.facts b{display:block;font-family:'Noto Serif KR',serif;font-weight:400;font-size:clamp(22px,2.2vw,32px)}
.facts span{font-size:12px;opacity:.62;letter-spacing:.04em}
@media(max-width:700px){.facts{grid-template-columns:repeat(2,1fr);gap:16px 0}}
.a-about{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,5vw,90px);align-items:center}
.a-about img{width:100%;aspect-ratio:4/5;object-fit:cover}

.rev{display:grid;grid-template-columns:280px 1fr;gap:clamp(24px,5vw,80px);align-items:start}
.rev .score b{display:block;font-family:'Cormorant Garamond',serif;font-size:84px;font-weight:300;line-height:1;margin:-14px 0 22px}
.rev .score span{display:block;font-size:13px;opacity:.65}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips span{border:1px solid rgba(0,0,0,.2);border-radius:30px;padding:7px 14px;font-size:13px}
.rev blockquote{font-family:'Noto Serif KR',serif;font-weight:300;font-size:clamp(17px,1.6vw,22px);line-height:1.8}
.rev cite{display:block;margin-top:14px;font-style:normal;font-size:13px;opacity:.6}
@media(max-width:800px){.rev{grid-template-columns:1fr}}
.a-cta{margin-top:clamp(80px,10vw,150px);position:relative;color:#fff;text-align:center;padding:clamp(80px,12vw,180px) 20px;overflow:hidden}
.a-cta img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.a-cta:before{content:'';position:absolute;inset:0;background:rgba(15,31,25,.55);z-index:1}
.a-cta>div{position:relative;z-index:2}
.a-cta h2{font-family:'Noto Serif KR',serif;font-weight:300;font-size:clamp(24px,3vw,42px)}
.a-cta .btn{margin-top:26px}
.va .foot{background:#24211f;color:#d9d3c8;margin-top:0}
.pj-hero{position:relative;height:min(88vh,64vw);min-height:340px;overflow:hidden}
.pj-hero img{width:100%;height:100%;object-fit:cover}
.pj-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-top:48px}
.pj-head h1{font-family:'Noto Serif KR',serif;font-weight:400;font-size:clamp(26px,3.4vw,46px);line-height:1.25}
.pj-meta{display:grid;grid-template-columns:repeat(4,auto);gap:6px 28px;font-size:14px;margin-top:18px}

@media(max-width:600px){.pj-meta{grid-template-columns:repeat(2,auto)}}

/* =================== B : Practical Home =================== */
.vb{background:#f4f1ec;color:#1b2a24}

.b-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:clamp(36px,5vw,70px)}

.b-stats span{font-size:13px;opacity:.65}
@media(max-width:760px){.b-stats{grid-template-columns:repeat(2,1fr)}}

.ht{display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;opacity:.82;min-width:0;padding:6px 4px;transition:opacity .4s}

<div id="app"></div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="현장 사진 크게 보기"><button class="cl" aria-label="닫기">×</button><button class="nav pv" aria-label="이전 사진"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg></button><div class="lwrap"><img class="lim" alt=""><img class="lon" alt=""><button class="lbulb" aria-pressed="false" aria-label="조명 켜기/끄기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg></button></div><button class="nav nx" aria-label="다음 사진"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 5l7 7-7 7"/></svg></button><div class="cnt"></div></div>
